# Release packages, on version tags only (FT-ARC-017, FT-ARC-022, FT-GEN-012,
# FT-LIC-008). PRs and main keep the single gate job in ci.yml. Builds the
# Linux, Windows and macOS packages of the tagged commit with
# tools/release/build.sh, inspects them, and drafts a GitHub release the owner
# publishes after the smoke tests and macOS signing (#13). gate.sh l6 runs on
# fugaku before the tag (FT-TST-005). Only the draft job can write to the
# repository, and it runs no repository code. docs/release.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Builds with a read-only token; checkout keeps no credentials in .git.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/full-theta
          key: release-${{ hashFiles('tools/godot-version', 'tools/godot.sha512', 'tools/release/piper.json', 'tools/tts/voices.json') }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - name: Install llvm-install-name-tool (macOS Piper helper rpath)
        run: |
          command -v llvm-install-name-tool || ls /usr/lib/llvm-*/bin/llvm-install-name-tool || {
            sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends llvm
          }
      - name: Build and inspect packages (FT-ARC-022, FT-LIC-008)
        # build.sh ends with tools/release/inspect_packages.py.
        run: tools/release/build.sh "$GITHUB_REF_NAME" build/release
      - name: Release notes
        run: >-
          uv run --quiet --project tools python tools/release/notes.py
          --version "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" build/release
          > build/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # act (the local dry run) stops here, before anything is published.
        if: ${{ !env.ACT }}
        with:
          name: release
          path: |
            build/release/*.tar.gz
            build/release/*.zip
            build/release/SHA256SUMS
            build/release-notes.md
          retention-days: 7

  # The only job with write access: it runs no repository code, just drafts
  # the release from the package job's files.
  draft:
    needs: package
    if: ${{ github.actor != 'nektos/act' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag
          --repo "$GITHUB_REPOSITORY"
          --title "Full Theta $GITHUB_REF_NAME" --notes-file release-notes.md
          release/*.tar.gz release/*.zip release/SHA256SUMS
