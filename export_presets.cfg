[preset.0]

name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="build_info.json, audio/prerendered/*, audio/prerendered_host/*, content/dialogue/*.json, content/conversations/*.json, content/i18n/strings.json, content/voices.json, content/tips/tips.json"
exclude_filter="tests/*, tools/*, docs/*, addons/gdUnit4/*, build/*"
export_path="build/linux/full-theta.x86_64"

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"

[preset.1]

name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="build_info.json, audio/prerendered/*, audio/prerendered_host/*, content/dialogue/*.json, content/conversations/*.json, content/i18n/strings.json, content/voices.json, content/tips/tips.json"
exclude_filter="tests/*, tools/*, docs/*, addons/gdUnit4/*, build/*"
export_path="build/windows/full-theta.exe"

[preset.1.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
application/modify_resources=false

[preset.2]

name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="build_info.json, audio/prerendered/*, audio/prerendered_host/*, content/dialogue/*.json, content/conversations/*.json, content/i18n/strings.json, content/voices.json, content/tips/tips.json"
exclude_filter="tests/*, tools/*, docs/*, addons/gdUnit4/*, build/*"
export_path="build/macos/full-theta.zip"

[preset.2.options]

application/bundle_identifier="io.github.migueltorrescosta.fulltheta"
codesign/codesign=0
notarization/notarization=0

[preset.3]

name="Web"
platform="Web"
runnable=false
export_filter="all_resources"
include_filter="build_info.json, content/dialogue/*.json, content/conversations/*.json, content/i18n/strings.json, content/voices.json, content/tips/tips.json"
exclude_filter="tests/*, tools/*, docs/*, addons/gdUnit4/*, build/*, audio/prerendered/*, audio/prerendered_host/*"
export_path="build/web/index.html"

[preset.3.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/custom_html_shell="res://app/web/shell.html"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=false
