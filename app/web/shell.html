<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<title>$GODOT_PROJECT_NAME</title>
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: white; background-color: black; overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#status { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; font: 20px sans-serif; gap: 16px; }
#tips { font: 14px sans-serif; opacity: 0.7; max-width: 80%; text-align: center; }
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas">This browser has no canvas support.</canvas>
<div id="status">
  <span id="progress">Loading</span>
  <span id="tips"></span>
</div>
<script src="$GODOT_URL"></script>
<script>
// Web shell for browser stations (FT-NET-030, D108), promoted from spike S3.
// Godot's default shell refuses to start outside a secure context, and a plain
// http:// LAN page isn't one. A no-threads build needs no SharedArrayBuffer, so
// this shell ignores that one check.
// Upstream: https://github.com/godotengine/godot/issues/124636; on an engine
// upgrade, check it and use the default shell once fixed (docs/release.md).
const GODOT_CONFIG = $GODOT_CONFIG;
const engine = new Engine(GODOT_CONFIG);
const progress = document.getElementById('progress');
const tipsEl = document.getElementById('tips');
const missing = Engine.getMissingFeatures({ threads: $GODOT_THREADS_ENABLED })
  .filter((m) => !m.startsWith('Secure Context'));
const LOADING_TIPS = [
  "Hold F to face your target.",
  "Space is all-stop.",
  "Say where things are like a clock: 12 is ahead, 3 is right.",
  "Press ? for the controls.",
  "Middle-click pings what's under the cursor.",
  "Hold X to close in on your target.",
  "Press T to cycle targets.",
  "Shift+middle-click drops a mark."
];
var tipIndex = 0;
var tipTimer = null;
function showNextTip() {
  tipsEl.textContent = LOADING_TIPS[tipIndex];
  tipIndex = (tipIndex + 1) % LOADING_TIPS.length;
}
if (missing.length !== 0) {
  progress.textContent = 'This browser is missing: ' + missing.join(', ');
  tipsEl.textContent = '';
} else {
  showNextTip();
  tipTimer = setInterval(showNextTip, 4000);
  engine.startGame({
    onProgress: (current, total) => {
      progress.textContent = total > 0 ? 'Loading ' + Math.round(100 * current / total) + ' %' : 'Loading';
    },
  }).then(() => {
    if (tipTimer) { clearInterval(tipTimer); }
    progress.remove();
    tipsEl.remove();
  }, (err) => {
    if (tipTimer) { clearInterval(tipTimer); }
    progress.textContent = String(err);
    tipsEl.textContent = '';
  });
}
</script>
</body>
</html>
