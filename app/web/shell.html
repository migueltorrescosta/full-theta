<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
<title>$GODOT_PROJECT_NAME</title>
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
/* The page is the dynamic viewport (it tracks the browser's toolbars, #28); the canvas
   fills it edge to edge and the game keeps its controls inside the safe area itself
   (presentation/touch/safe_area.gd reads the insets through ft.safeArea). */
html, body { height: 100vh; height: 100dvh; }
body { color: white; background-color: black; overflow: hidden; touch-action: none; }
/* Measures env(safe-area-inset-*): the notch, the home indicator. */
#safe { position: fixed; visibility: hidden; pointer-events: none; top: 0; left: 0;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
    env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
#canvas { display: block; }
#canvas:focus { outline: none; }
/* The loading screen (#28, P28-Tips, P28-LoadBar): tips are the main feature, a thin bar
   of the real download progress under the tip; dark, inside the safe area. Colours are
   presentation/palette.gd's background, text, text_dim and accent. */
#status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  gap: 16px; box-sizing: border-box; font-family: sans-serif; user-select: none;
  -webkit-user-select: none; cursor: default; background-color: #0b0f14;
  padding: max(8px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px))
    max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background-image: radial-gradient(circle at 20px 30px, #e6edf3b0 1px, transparent 1.5px),
    radial-gradient(circle at 90px 140px, #e6edf370 1px, transparent 1.5px),
    radial-gradient(circle at 170px 70px, #e6edf3c0 1.2px, transparent 1.8px),
    radial-gradient(circle at 230px 190px, #e6edf360 1px, transparent 1.5px),
    radial-gradient(circle at 130px 20px, #e6edf380 1px, transparent 1.5px),
    radial-gradient(circle at 50px 180px, #e6edf390 1px, transparent 1.5px);
  background-size: 260px 220px; animation: drift 240s linear infinite; }
@keyframes drift { from { background-position: 0 0; } to { background-position: -1040px 0; } }
#tipcol { position: relative; width: min(600px, 100%); display: flex; flex-direction: column;
  align-items: center; text-align: center; }
/* While the engine's long start task runs no script can change the tip, so the page lays the
   next few over it as CSS animations (see startCssTips). */
#tipcol.css #topic, #tipcol.css #tip { visibility: hidden; }
#slides { position: absolute; top: 0; left: 0; right: 0; }
.slide { position: absolute; top: 0; left: 0; right: 0; opacity: 0; display: flex;
  flex-direction: column; align-items: center; }
.slide .s-topic { font-size: 12px; letter-spacing: 0.05em; color: #8b98a5; min-height: 16px; }
.slide .s-tip { font-size: 20px; line-height: 1.5; color: #e6edf3; margin-top: 8px; }
#topic { font-size: 12px; letter-spacing: 0.05em; color: #8b98a5; min-height: 16px; }
#tip { font-size: 20px; line-height: 1.5; color: #e6edf3; margin-top: 8px; min-height: 4.5em;
  display: flex; align-items: center; justify-content: center; }
#bar { position: relative; overflow: hidden; width: 100%; height: 4px; margin-top: 24px;
  background: rgba(255, 255, 255, 0.15); }
/* The download fills the bar by transform (the real progress). After it the bar gives way to
   a radar scope: a sweep turns once per 5 s and a blip fades in its wake. It stays in place,
   so it claims no progress. It moves by transform and opacity only, which the browser
   animates off the main thread, so it keeps going while the engine compiles the game's
   scripts (seconds on a phone) and no timer or text update can run (#11, DC3, D305). */
#fill { width: 100%; height: 100%; background: rgba(88, 166, 255, 0.7); transform-origin: left;
  transform: scaleX(0); transition: transform 0.3s ease-out; }
#radar { display: none; position: absolute; left: 50%; top: 50%; width: 64px; height: 64px;
  margin: -32px 0 0 -32px; box-sizing: border-box; border-radius: 50%; overflow: hidden;
  border: 1px solid rgba(88, 166, 255, 0.35);
  background: radial-gradient(circle, transparent 0 30%, rgba(88, 166, 255, 0.18) 30% calc(30% + 1px),
    transparent calc(30% + 1px) 62%, rgba(88, 166, 255, 0.18) 62% calc(62% + 1px),
    transparent calc(62% + 1px)); }
#radar .sweep { position: absolute; inset: 0; border-radius: 50%; will-change: transform;
  background: conic-gradient(from 0deg, rgba(88, 166, 255, 0) 0deg, rgba(88, 166, 255, 0) 250deg,
    rgba(88, 166, 255, 0.5) 358deg, #58a6ff 360deg); }
#radar .blip { position: absolute; left: 68%; top: 26%; width: 5px; height: 5px;
  border-radius: 50%; background: #58a6ff; opacity: 0; will-change: opacity; }
#bar.busy { overflow: visible; background: none; height: 64px; margin: 14px 0 6px; }
#bar.busy #fill { display: none; }
#bar.busy #radar { display: block; }
#bar.busy #radar .sweep { animation: radar-spin 5s linear infinite; }
#bar.busy #radar .blip { animation: radar-blip 5s linear infinite; }
@keyframes radar-spin { to { transform: rotate(360deg); } }
/* The sweep passes the blip at 20 % of the lap (upper right). */
@keyframes radar-blip { 0%, 19% { opacity: 0; } 21% { opacity: 1; } 70%, 100% { opacity: 0; } }
#progress { font-size: 12px; color: #8b98a5; margin-top: 6px; }
.arrow { flex: none; width: 48px; height: 48px; border-radius: 6px; border: 1px solid #3a4654;
  background: #151b23; color: #e6edf3; font-size: 24px; line-height: 1; padding: 0; }
/* A phone upright: the arrows go under the column. */
@media (max-width: 520px) {
  #status { flex-wrap: wrap; align-content: center; }
  #tipcol { order: -1; }
  #tip { min-height: 6em; }
}
/* Reduced motion: a still frame, the sweep at 60 degrees and the blip at 0.7. */
@media (prefers-reduced-motion: reduce) {
  #status, #bar.busy #radar .sweep, #bar.busy #radar .blip { animation: none; }
  #bar.busy #radar .sweep { transform: rotate(60deg); }
  #bar.busy #radar .blip { opacity: 0.7; }
}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas">This browser has no canvas support.</canvas>
<div id="safe"></div>
<div id="status">
  <button class="arrow" id="tipBack" aria-label="Previous tip">&lsaquo;</button>
  <div id="tipcol">
    <div id="topic"></div>
    <div id="tip" aria-live="polite"></div>
    <div id="bar"><div id="fill"></div><div id="radar" role="img" aria-label="Loading"><div class="sweep"></div><div class="blip"></div></div></div>
    <div id="progress">Loading</div>
  </div>
  <button class="arrow" id="tipNext" aria-label="Next tip">&rsaquo;</button>
</div>
<script src="$GODOT_URL"></script>
<script>
// Page helpers for the game (window.ft), used through app/web/*.gd (D196, D200, FT-NET-046).
// They live here, not in GDScript, because iOS only raises the keyboard, plays a video
// or resumes audio from inside a real touch or click handler, and Godot's input events
// reach GDScript a frame later, outside that handler.
window.ft = (function () {
  const canvas = document.getElementById('canvas');
  const ft = {
    audioContexts: [], // every AudioContext the engine creates (it keeps its own out of reach)
    inputs: {},       // id -> {x, y, w, h} in canvas pixels, registered by WebTextField
    active: null,     // id of the text field whose overlay input has focus
    texts: {},        // id -> {text, submitted, closed} waiting for a listener
    listeners: {},    // id -> fn(json): GDScript's callback of a text field
    onWake: null,     // fn(): GDScript's callback for a page wake
    wakes: 0,         // times the page came back after being hidden for 2 s or more
    hiddenAt: 0,
    openedAt: 0,
    keepAwake: null,  // set by KeepAwake: {play: fn}; retried on every gesture until playing
    actions: {},      // id -> {x, y, w, h, name} in canvas pixels: buttons whose tap needs a gesture
    maxDpr: 2,        // the render scale cap (#28): a dpr-3 phone draws 4x, not 9x, the pixels
  };
  let el = null;

  // Caps the device pixel ratio the engine sizes its canvas by (and LayoutMode reads):
  // fill rate is a phone's main battery cost. Text is a little softer on a 3x screen.
  (function capDpr() {
    try {
      const own = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio') ||
        Object.getOwnPropertyDescriptor(Window.prototype, 'devicePixelRatio');
      if (!own) { return; }
      const read = own.get ? function () { return own.get.call(window); } : function () { return own.value; };
      Object.defineProperty(window, 'devicePixelRatio', {
        configurable: true,
        get: function () { return Math.min(ft.maxDpr, read() || 1); },
      });
    } catch (e) { /* the engine uses the native ratio */ }
  })();

  // The engine's audio object is private to its closure, so record the contexts it creates:
  // the first tap resumes them (FT-AUD-017), and the top bar shows their state.
  ['AudioContext', 'webkitAudioContext'].forEach(function (name) {
    const Native = window[name];
    if (!Native) { return; }
    window[name] = class extends Native {
      constructor(...args) { super(...args); ft.audioContexts.push(this); }
    };
  });

  // Records what happened to a field and, when GDScript listens to it, hands it over as JSON.
  function note(id, patch) {
    const t = Object.assign(ft.texts[id] || {}, patch);
    ft.texts[id] = t;
    const listener = ft.listeners[id];
    if (listener) {
      delete ft.texts[id];
      listener(JSON.stringify(t));
    }
  }

  function overlay() {
    if (el) { return el; }
    el = document.createElement('input');
    el.type = 'text';
    el.autocomplete = 'off';
    el.autocapitalize = 'none';
    el.spellcheck = false;
    // 16 px or more keeps iOS from zooming the page when the input takes focus.
    el.style.cssText = 'position:fixed;display:none;box-sizing:border-box;z-index:10;' +
      'margin:0;padding:0 8px;border:2px solid #7aa7ff;border-radius:6px;' +
      'background:#10141c;color:#e8eefc;font:16px sans-serif;outline:none';
    el.addEventListener('input', () => {
      if (ft.active) { note(ft.active, { text: el.value }); }
    });
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && ft.active) {
        note(ft.active, { text: el.value, submitted: true });
        el.blur();
      }
      e.stopPropagation();
    });
    el.addEventListener('keyup', (e) => e.stopPropagation());
    el.addEventListener('blur', () => {
      if (ft.active) { note(ft.active, { text: el.value, closed: true }); }
      ft.active = null;
      el.style.display = 'none';
    });
    document.body.appendChild(el);
    return el;
  }

  // Registers (or moves) the overlay target of one text field; rect in canvas pixels.
  ft.setInput = function (id, x, y, w, h, text, placeholder, maxLength) {
    ft.inputs[id] = { x: x, y: y, w: w, h: h, text: text, placeholder: placeholder, max: maxLength };
    if (ft.active === id) { place(id); }
  };
  ft.clearInput = function (id) {
    delete ft.inputs[id];
    if (ft.active === id && el) { el.blur(); }
  };
  function place(id) {
    const r = ft.inputs[id], box = canvas.getBoundingClientRect();
    const k = box.width / canvas.width;
    el.style.left = (box.left + r.x * k) + 'px';
    el.style.top = (box.top + r.y * k) + 'px';
    el.style.width = (r.w * k) + 'px';
    el.style.height = (r.h * k) + 'px';
  }
  function open(id) {
    const r = ft.inputs[id], input = overlay();
    ft.active = id;
    input.value = r.text || '';
    input.placeholder = r.placeholder || '';
    input.maxLength = r.max > 0 ? r.max : 524288;
    place(id);
    input.style.display = 'block';
    input.focus();           // inside the gesture: this is what raises the keyboard
    ft.openedAt = Date.now();
    // Godot focuses its canvas on the emulated mouse events that follow; take it back.
    [60, 250].forEach(function (ms) {
      setTimeout(function () { if (ft.active === id && document.activeElement !== input) { input.focus(); } }, ms);
    });
    note(id, { text: input.value, opened: true });
  }
  // Registers (or moves) a button whose action needs the tap itself (fullscreen); rect in
  // canvas pixels. The game draws the button; the shell acts inside the tap handler.
  ft.setAction = function (id, x, y, w, h, name) {
    ft.actions[id] = { x: x, y: y, w: w, h: h, name: name };
  };
  ft.clearAction = function (id) { delete ft.actions[id]; };

  // The safe-area insets (notch, home indicator) in CSS pixels, as JSON {l, t, r, b}.
  ft.safeArea = function () {
    const probe = document.getElementById('safe');
    if (!probe) { return '{"l":0,"t":0,"r":0,"b":0}'; }
    const cs = getComputedStyle(probe);
    const px = function (v) { return parseFloat(v) || 0; };
    return JSON.stringify({ l: px(cs.paddingLeft), t: px(cs.paddingTop),
      r: px(cs.paddingRight), b: px(cs.paddingBottom) });
  };
  // Canvas pixels per CSS pixel: the capped device pixel ratio the engine used.
  ft.canvasScale = function () {
    const box = canvas.getBoundingClientRect();
    return box.width > 0 ? canvas.width / box.width : (window.devicePixelRatio || 1);
  };

  // Fullscreen and a landscape lock: offered on Android and iPad, never on iPhone, whose
  // Safari has no element fullscreen (#28). The lock works on Android only, in fullscreen.
  function fullscreenApi() {
    const d = document.documentElement;
    return d.requestFullscreen || d.webkitRequestFullscreen || null;
  }
  function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  ft.fullscreenOffered = function () {
    const ua = navigator.userAgent;
    const ipad = /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    return !!fullscreenApi() && !/iPhone|iPod/.test(ua) && (/Android/.test(ua) || ipad) && !isFullscreen();
  };
  // The top bar's toggle (D323): any browser with fullscreen but an iPhone's, in either state.
  ft.fullscreenToggleOffered = function () {
    return !!fullscreenApi() && !/iPhone|iPod/.test(navigator.userAgent);
  };
  ft.isFullscreen = isFullscreen;
  let fullscreenAt = 0;
  function toggleFullscreen() {
    if (!isFullscreen()) { goFullscreen(); return; }
    if (Date.now() - fullscreenAt < 1000) { return; }
    fullscreenAt = Date.now();
    try {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } catch (e) { /* refused: the page stays as it is */ }
  }
  function goFullscreen() {
    // One tap fires pointerup, touchend and click: act on the first.
    if (isFullscreen() || Date.now() - fullscreenAt < 1000) { return; }
    fullscreenAt = Date.now();
    try {
      const done = fullscreenApi().call(document.documentElement);
      Promise.resolve(done).then(function () {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(function () {});
        }
      }).catch(function () {});
    } catch (e) { /* refused: the page stays as it is */ }
  }

  // Sets (or with null removes) the function that gets a field's events as JSON.
  ft.listen = function (id, fn) {
    if (fn) { ft.listeners[id] = fn; } else { delete ft.listeners[id]; delete ft.texts[id]; }
  };
  ft.setOnWake = function (fn) { ft.onWake = fn; };
  function wake() {
    ft.wakes++;
    if (ft.onWake) { ft.onWake(); }
  }

  function onGesture(e) {
    const t = e.changedTouches ? e.changedTouches[0] : e;
    // A touch also fires an emulated click a moment later: it mustn't close what it opened.
    if (ft.active !== null && el && e.target !== el && Date.now() - ft.openedAt > 600) { el.blur(); }
    if (t && typeof t.clientX === 'number' && ft.active === null) {
      const box = canvas.getBoundingClientRect();
      const x = (t.clientX - box.left) * canvas.width / box.width;
      const y = (t.clientY - box.top) * canvas.height / box.height;
      for (const id in ft.inputs) {
        const r = ft.inputs[id];
        if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) { open(id); break; }
      }
      for (const id in ft.actions) {
        const a = ft.actions[id];
        if (x >= a.x && x <= a.x + a.w && y >= a.y && y <= a.y + a.h) {
          if (a.name === 'fullscreen') { goFullscreen(); }
          if (a.name === 'fullscreen_toggle') { toggleFullscreen(); }
        }
      }
    }
    // The first gesture unlocks audio (FT-AUD-017) and starts the keep-awake video.
    ft.audioContexts.forEach(function (ctx) {
      if (ctx.state !== 'running') { ctx.resume().catch(function () {}); }
    });
    if (ft.keepAwake) { ft.keepAwake(); }
  }
  ['pointerup', 'touchend', 'click', 'keydown'].forEach(function (name) {
    document.addEventListener(name, onGesture, { capture: true, passive: true });
  });

  // Audio state for the top-bar toggle: 'running', 'suspended' or '' before the engine's audio starts.
  ft.audioState = function () {
    return ft.audioContexts.length ? ft.audioContexts[0].state : '';
  };

  // Safari suspends a page that is hidden, and its socket may be dead on return without
  // a close event: tell the game, which reconnects with its token (no reload).
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { ft.hiddenAt = Date.now(); return; }
    if (ft.hiddenAt && Date.now() - ft.hiddenAt >= 2000) { wake(); }
    ft.hiddenAt = 0;
  });
  window.addEventListener('pageshow', function (e) { if (e.persisted) { wake(); } });
  window.addEventListener('online', wake);
  return ft;
})();
</script>
<script>
// Web shell for browser stations (FT-NET-030, D108), promoted from spike S3.
// Godot's default shell refuses to start outside a secure context, and a plain
// http:// LAN page isn't one. A no-threads build needs no SharedArrayBuffer, so
// this shell ignores that one check.
// Upstream: https://github.com/godotengine/godot/issues/124636; on an engine
// upgrade, check it and use the default shell once fixed (docs/release.md).
const GODOT_CONFIG = $GODOT_CONFIG;
const engine = new Engine(GODOT_CONFIG);
const progress = document.getElementById('progress');
const statusEl = document.getElementById('status');
const missing = Engine.getMissingFeatures({ threads: $GODOT_THREADS_ENABLED })
  .filter((m) => !m.startsWith('Secure Context'));
/* tips:begin (tools/tips_shell.py writes the next line from content/tips/tips.json) */
const FT_TIPS = {"topics":{"lobby":{"en":"Lobby","pt_PT":"Sala de espera","it":"Sala d'attesa"},"setup":{"en":"Setting up","pt_PT":"Preparar o jogo","it":"Preparare la partita"},"novice":{"en":"First games","pt_PT":"Primeiros jogos","it":"Prime partite"},"talk":{"en":"Talking","pt_PT":"Falar","it":"Parlare"},"hard":{"en":"Hard","pt_PT":"Difícil","it":"Difficile"},"crews":{"en":"Crews","pt_PT":"Tripulações","it":"Equipaggi"},"modes":{"en":"Modes","pt_PT":"Modos","it":"Modalità"},"helm":{"en":"Helm","pt_PT":"Leme","it":"Timone"},"weapons":{"en":"Weapons","pt_PT":"Armas","it":"Armi"},"engineering":{"en":"Engineering","pt_PT":"Engenharia","it":"Ingegneria"},"science":{"en":"Science","pt_PT":"Ciência","it":"Scienza"},"relay":{"en":"Relay","pt_PT":"Retransmissão","it":"Collegamento"},"comms":{"en":"Comms","pt_PT":"Comunicações","it":"Comunicazioni"},"captain":{"en":"Captain","pt_PT":"Capitão","it":"Capitano"}},"tips":[{"topic":"lobby","en":"Tap a station to take it. Tap it again to leave it.","pt_PT":"Toca num posto para o ocupar. Toca outra vez para o largar.","it":"Tocca una postazione per prenderla. Toccala di nuovo per lasciarla."},{"topic":"lobby","en":"A ship needs three crew and every station covered before it can start.","pt_PT":"Uma nave precisa de três tripulantes e de todos os postos cobertos para começar.","it":"Una nave ha bisogno di tre membri e di tutte le postazioni coperte per partire."},{"topic":"setup","en":"Phones and tablets join in the browser: no install, just the host's link.","pt_PT":"Telemóveis e tablets entram pelo navegador: sem instalar nada, só o link do anfitrião.","it":"Telefoni e tablet entrano dal browser: niente da installare, basta il link dell'ospite."},{"topic":"setup","en":"Turn the sound on: the ship's computer and other ships speak, with subtitles.","pt_PT":"Liga o som: o computador da nave e as outras naves falam, com legendas.","it":"Accendi l'audio: il computer di bordo e le altre navi parlano, con i sottotitoli."},{"topic":"novice","en":"Say what you see out loud. Your crew can't see your screen.","pt_PT":"Diz em voz alta o que vês. A tripulação não vê o teu ecrã.","it":"Di' ad alta voce cosa vedi. L'equipaggio non vede il tuo schermo."},{"topic":"novice","en":"Ping something to flash it on every screen of your ship for three seconds.","pt_PT":"Faz ping a algo para o fazer piscar em todos os ecrãs da nave durante três segundos.","it":"Fai un ping su qualcosa per farlo lampeggiare su tutti gli schermi della nave per tre secondi."},{"topic":"novice","en":"Nothing slows you down in space. To stop, you have to thrust the other way.","pt_PT":"No espaço nada te trava. Para parar tens de acelerar no sentido contrário.","it":"Nello spazio niente ti frena. Per fermarti devi spingere nella direzione opposta."},{"topic":"talk","en":"Give directions like a clock: 12 is the bow, 3 is right, 6 behind, 9 left.","pt_PT":"Dá direções como um relógio: 12 é a proa, 3 a direita, 6 atrás, 9 a esquerda.","it":"Dai le direzioni come un orologio: 12 è la prua, 3 destra, 6 dietro, 9 sinistra."},{"topic":"talk","en":"Close is under 1 km, mid up to 10 km, far beyond that.","pt_PT":"Perto é menos de 1 km, médio até 10 km, longe para lá disso.","it":"Vicino è meno di 1 km, medio fino a 10 km, lontano oltre."},{"topic":"talk","en":"Names beat directions: \"Helm, approach Bravo\" is clearer than \"go left a bit\".","pt_PT":"Nomes valem mais que direções: \"Leme, aproxima-te de Bravo\" é mais claro que \"vai um pouco à esquerda\".","it":"I nomi battono le direzioni: \"Timone, avvicinati a Bravo\" è più chiaro di \"vai un po' a sinistra\"."},{"topic":"hard","en":"On Hard no data crosses between stations: only marks, pings and your voices.","pt_PT":"No Difícil nenhum dado passa entre postos: só marcas, pings e as vossas vozes.","it":"In Difficile nessun dato passa tra le postazioni: solo segnaposto, ping e le vostre voci."},{"topic":"hard","en":"On Hard there are no request chips. Ask out loud.","pt_PT":"No Difícil não há pedidos rápidos. Pede em voz alta.","it":"In Difficile non ci sono richieste rapide. Chiedi ad alta voce."},{"topic":"crews","en":"Three players? Try Tactical, Systems and Ops: every station covered.","pt_PT":"Três jogadores? Experimentem Tático, Sistemas e Operações: todos os postos cobertos.","it":"Tre giocatori? Provate Tattica, Sistemi e Operazioni: tutte le postazioni coperte."},{"topic":"crews","en":"Ops (Relay + Comms) is the lightest joint view: good for a new player.","pt_PT":"Operações (Retransmissão + Comunicações) é a vista conjunta mais leve: boa para quem começa.","it":"Operazioni (Collegamento + Comunicazioni) è la vista congiunta più leggera: ottima per chi inizia."},{"topic":"modes","en":"Co-op puts every ship on one side: one run, one goal.","pt_PT":"Cooperativo põe todas as naves do mesmo lado: uma missão, um objetivo.","it":"Cooperativa mette tutte le navi dalla stessa parte: una missione, un obiettivo."},{"topic":"modes","en":"Race: every ship flies the same encounters. First to finish wins, and shooting is allowed.","pt_PT":"Corrida: todas as naves fazem os mesmos encontros. Ganha quem acabar primeiro, e pode-se disparar.","it":"Gara: tutte le navi fanno gli stessi incontri. Vince chi finisce prima, e si può sparare."},{"topic":"helm","en":"Hold Approach to close on your target at a safe distance and match its speed.","pt_PT":"Mantém Aproximar carregado para chegar ao alvo a uma distância segura e igualar a velocidade.","it":"Tieni premuto Avvicina per raggiungere il bersaglio a distanza sicura e pareggiarne la velocità."},{"topic":"helm","en":"To jump, select a site or mark and face it first. A jump spools for 8 s.","pt_PT":"Para saltar, seleciona um local ou marca e vira-te para ele. O salto carrega 8 s.","it":"Per saltare, seleziona un sito o un segnaposto e puntalo. Il salto si carica in 8 s."},{"topic":"weapons","en":"Call your target before you shoot: friendly fire is on.","pt_PT":"Diz o alvo antes de disparar: o fogo amigo está ligado.","it":"Di' il bersaglio prima di sparare: il fuoco amico è attivo."},{"topic":"weapons","en":"Aim at the lead reticle, not the ship: it shows where your shot will meet it.","pt_PT":"Aponta à mira de antecipação, não à nave: mostra onde o tiro a vai apanhar.","it":"Mira al reticolo d'anticipo, non alla nave: mostra dove il colpo la incontrerà."},{"topic":"engineering","en":"Every station runs on your power. Move pips to whatever needs it now.","pt_PT":"Todos os postos dependem da tua energia. Passa os pontos para o que precisa agora.","it":"Ogni postazione vive della tua energia. Sposta le tacche su ciò che serve ora."},{"topic":"engineering","en":"Say the shields out loud when they drop. Helm and Weapons may not see the number.","pt_PT":"Diz os escudos em voz alta quando descem. Leme e Armas podem não ver o número.","it":"Di' gli scudi ad alta voce quando scendono. Timone e Armi potrebbero non vedere il numero."},{"topic":"science","en":"Pick a contact, then scan it. Turn the frame until it matches the dots.","pt_PT":"Escolhe um contacto e faz-lhe um scan. Roda a moldura até coincidir com os pontos.","it":"Scegli un contatto e scansionalo. Ruota la struttura finché coincide con i punti."},{"topic":"science","en":"Something broke? Scan your own ship to find the cause for Engineering.","pt_PT":"Algo avariou? Analisa a tua própria nave para dar a causa à Engenharia.","it":"Qualcosa si è guastato? Scansiona la tua nave per dare la causa all'Ingegneria."},{"topic":"relay","en":"Drag on the map to drop a mark. Drop it on a contact and it follows that contact.","pt_PT":"Arrasta no mapa para pôr uma marca. Larga-a num contacto e ela segue-o.","it":"Trascina sulla mappa per mettere un segnaposto. Lascialo su un contatto e lo seguirà."},{"topic":"relay","en":"Launch a probe to see beyond your sensors. You start with three.","pt_PT":"Lança uma sonda para ver além dos sensores. Começas com três.","it":"Lancia una sonda per vedere oltre i sensori. Ne hai tre all'inizio."},{"topic":"comms","en":"Hail a ship before shooting starts: some talk, some bluff, some surrender.","pt_PT":"Chama uma nave antes do tiroteio: umas falam, outras fazem bluff, outras rendem-se.","it":"Chiama una nave prima che si spari: alcune parlano, altre bluffano, altre si arrendono."},{"topic":"comms","en":"Tell Weapons when a ship surrenders. Send Hold fire if you have to.","pt_PT":"Diz às Armas quando uma nave se rende. Manda Cessar fogo se for preciso.","it":"Di' alle Armi quando una nave si arrende. Manda Cessate il fuoco se serve."},{"topic":"captain","en":"The Captain has no controls, only the big picture. Decide, then say it out loud.","pt_PT":"O Capitão não tem controlos, só a visão geral. Decide e diz em voz alta.","it":"Il Capitano non ha comandi, solo il quadro generale. Decidi e dillo ad alta voce."},{"topic":"captain","en":"As Captain you choose the main screen: forward, chase, tactical, close-up or status.","pt_PT":"Como Capitão escolhes o ecrã principal: frente, perseguição, tático, grande plano ou estado.","it":"Da Capitano scegli lo schermo principale: avanti, inseguimento, tattica, primo piano o stato."}]};
/* tips:end */
// The tips rotate in a random order (shuffled once per page load), each for
// max(5 s, characters / 15 + 1 s) (P28-Tips); a tap on the left half goes back, on the
// right half forward. The language is the browser's (the session's isn't known yet).
const LANG = (function () {
  const langs = navigator.languages || [navigator.language || 'en'];
  for (const l of langs) {
    if (/^pt/i.test(l)) { return 'pt_PT'; }
    if (/^it/i.test(l)) { return 'it'; }
    if (/^en/i.test(l)) { return 'en'; }
  }
  return 'en';
})();
const WORDS = {
  en: { loading: 'Downloading', start: 'Starting the game', connect: 'Connecting',
    lobby: 'Opening the lobby' },
  pt_PT: { loading: 'A descarregar', start: 'A iniciar o jogo', connect: 'A ligar',
    lobby: 'A abrir a sala de espera' },
  it: { loading: 'Download', start: 'Avvio del gioco', connect: 'Connessione',
    lobby: "Apertura della sala d'attesa" },
}[LANG];
function shuffled(list) {
  const out = list.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}
function textOf(entry) { return entry[LANG] || entry.en || ''; }
function tipSeconds(text) { return Math.max(5, text.length / 15 + 1); }
const tips = shuffled(FT_TIPS.tips);
const topicEl = document.getElementById('topic');
const tipEl = document.getElementById('tip');
const fillEl = document.getElementById('fill');
const barEl = document.getElementById('bar');
const tipcolEl = document.getElementById('tipcol');
var tipIndex = 0;
var tipTimer = null;
function showTip(step) {
  tipIndex = (tipIndex + step + tips.length) % tips.length;
  const tip = tips[tipIndex];
  const text = textOf(tip);
  topicEl.textContent = textOf(FT_TIPS.topics[tip.topic] || {}).toUpperCase();
  tipEl.textContent = text;
  clearTimeout(tipTimer);
  tipTimer = setTimeout(function () { showTip(1); }, tipSeconds(text) * 1000);
}
function stopTips() { clearTimeout(tipTimer); tipTimer = null; }
// The engine's start is one long task in which no timer or script runs, so the tips can't
// rotate from script. Instead the page lays the next few tips over the current one as CSS
// animations, which the browser runs off the main thread, each for its usual time; when script
// runs again (stopCssTips) the one showing becomes the current tip and the timer takes over.
var cssTips = null;
function startCssTips() {
  const picks = [], seconds = [];
  for (let i = 0; i < 4; i++) {
    const tip = tips[(tipIndex + i) % tips.length];
    picks.push(tip);
    seconds.push(tipSeconds(textOf(tip)));
  }
  const total = seconds.reduce(function (a, b) { return a + b; }, 0);
  const sheet = document.createElement('style');
  const holder = document.createElement('div');
  holder.id = 'slides';
  var at = 0, css = '';
  picks.forEach(function (tip, i) {
    const from = 100 * at / total, to = 100 * (at + seconds[i]) / total;
    at += seconds[i];
    css += '@keyframes slide' + i + ' { 0% { opacity: ' + (i === 0 ? 1 : 0) + '; } ' +
      (i === 0 ? '' : from + '% { opacity: 0; } ' + (from + 0.5) + '% { opacity: 1; } ') +
      to + '% { opacity: 1; } ' + (to + 0.5) + '% { opacity: 0; } 100% { opacity: 0; } }\n' +
      '#slides .slide:nth-child(' + (i + 1) + ') { animation: slide' + i + ' ' + total +
      's linear infinite; }\n';
    const slide = document.createElement('div');
    slide.className = 'slide';
    const topic = document.createElement('div');
    topic.className = 's-topic';
    topic.textContent = textOf(FT_TIPS.topics[tip.topic] || {}).toUpperCase();
    const body = document.createElement('div');
    body.className = 's-tip';
    body.textContent = textOf(tip);
    slide.appendChild(topic);
    slide.appendChild(body);
    holder.appendChild(slide);
  });
  sheet.textContent = css;
  stopTips();
  tipcolEl.classList.add('css');
  tipcolEl.appendChild(sheet);
  tipcolEl.appendChild(holder);
  cssTips = { since: performance.now(), seconds: seconds, total: total, sheet: sheet, holder: holder };
}
function stopCssTips() {
  if (!cssTips) { return; }
  const c = cssTips;
  cssTips = null;
  var at = ((performance.now() - c.since) / 1000) % c.total, shown = 0;
  while (shown < c.seconds.length - 1 && at >= c.seconds[shown]) { at -= c.seconds[shown]; shown++; }
  c.sheet.remove();
  c.holder.remove();
  tipcolEl.classList.remove('css');
  tipIndex = (tipIndex + shown) % tips.length;
  showTip(0);
}
statusEl.addEventListener('click', function (e) {
  const box = statusEl.getBoundingClientRect();
  showTip(e.clientX < box.left + box.width / 2 ? -1 : 1);
});
// The loading stages, in order (#11, DC2). The page shows the download from the engine's real
// progress (onProgress); the game reports the later stages through ft.loadStage (app/web/
// load_stage.gd): "connect" when it starts joining, "lobby" when the server welcomed it, and
// "ready" when the lobby is up, which removes the overlay. "start" is set here before the
// engine starts, and the browser gets a frame to draw it first: the engine then runs one
// long task (starting, compiling the scripts, building the menu) in which no text can change.
// Only the download shows a bar; after it a radar sweep stands in, since the length of the
// later stages is unknown and a bar filling up would only pretend to know it (DC3).
const STAGES = ['download', 'start', 'connect', 'lobby', 'ready'];
var stage = 'download';
window.ft.stage = stage;
function setBar(share) {
  fillEl.style.transform = 'scaleX(' + share + ')';
}
function setStage(name) {
  // A later stage never goes back (a reconnect would otherwise reopen the overlay's text).
  if (STAGES.indexOf(name) <= STAGES.indexOf(stage) && name !== 'download') { return; }
  stage = name;
  window.ft.stage = name;
  if (name === 'start') { startCssTips(); } else { stopCssTips(); }
  if (name === 'ready') {
    stopTips();
    clearTimeout(failsafe);
    statusEl.remove(); // the whole overlay goes: it covers the canvas and would swallow every tap
    return;
  }
  barEl.classList.toggle('busy', name !== 'download');
  progress.textContent = WORDS[name === 'download' ? 'loading' : name];
}
window.ft.loadStage = setStage;
// The download: the engine's real progress fills the bar.
function setProgress(current, total) {
  if (stage !== 'download') { return; }
  if (total > 0) {
    const pct = Math.min(100, Math.round(100 * current / total));
    setBar(pct / 100);
    progress.textContent = WORDS.loading + ' \u00b7 ' + pct + ' %';
  } else {
    progress.textContent = WORDS.loading;
  }
}
// A frame for the browser to draw the page before a long task (not in a hidden tab: no
// frames come there).
function afterPaint() {
  return new Promise(function (resolve) {
    const timer = setTimeout(resolve, 300);
    requestAnimationFrame(function () { setTimeout(function () { clearTimeout(timer); resolve(); }, 0); });
  });
}
var failsafe = null;
if (missing.length !== 0) {
  progress.textContent = 'This browser is missing: ' + missing.join(', ');
} else {
  showTip(0);
  setProgress(0, 0);
  // startGame loads the files, then calls start(), which is where the long task begins.
  const startEngine = engine.start;
  engine.start = function () {
    const args = arguments;
    setStage('start');
    return afterPaint().then(function () { return startEngine.apply(engine, args); });
  };
  engine.startGame({ onProgress: setProgress }).then(() => {
    stopCssTips();
    // The game says "ready" itself; this is for a game that never does (an error before the
    // lobby), so the overlay can't hide its menu for good.
    failsafe = setTimeout(function () { setStage('ready'); }, 30000);
  }, (err) => {
    stopCssTips();
    stopTips();
    progress.textContent = String(err);
  });
}
</script>
